---
name: Setup Python with uv
description: Setup Python, install uv, and sync dependencies

inputs:
  python-version:
    description: Python version to use
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: true
    # Export UV_PYTHON so later `uv run` steps keep this interpreter instead
    # of re-syncing the environment to the version in .python-version.
    - name: Pin uv to Python ${{ inputs.python-version }}
      shell: bash
      run: echo "UV_PYTHON=${{ inputs.python-version }}" >> "$GITHUB_ENV"
    - name: Install all dependencies
      shell: bash
      run: uv sync --group dev
