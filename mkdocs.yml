site_name: Huginn
site_description: A Python-native, async-first test automation framework for network infrastructure.
site_url: https://chartinolabs.github.io/Huginn/
repo_url: https://github.com/ChartinoLabs/Huginn
repo_name: ChartinoLabs/Huginn
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Concepts:
      - Overview: concepts/overview.md
      - Execution Modes: concepts/execution-modes.md
      - Test Plan Structure: concepts/test-plan-structure.md
      - Job Archetypes: concepts/archetypes.md
      - Reconciliation: concepts/reconciliation.md
      - Pruning: concepts/pruning.md
  - Glossary: concepts/glossary.md
  - Authoring Jobs:
      - Overview: authoring/index.md
      - Static Parameter Validation: authoring/static-validation.md
      - Volatile Parameter Validation: authoring/volatile-validation.md
      - Change Jobs: authoring/change.md
      - Gate Jobs: authoring/gate.md
      - Unit Testing Jobs: authoring/unit-testing.md
  - Reference:
      - Testbed Schema: reference/testbed.md
      - Test Plan Schema: reference/test-plan.md
      - Configuration: reference/configuration.md
      - Context API: reference/context-api.md
      - Package Jobs: reference/package-jobs.md
      - CLI - reconcile: reference/reconcile.md
      - CLI - prune: reference/prune.md
  - Design:
      - Architecture: design/architecture.md
      - Connection Broker Plugins: design/connection-broker.md
      - Output and Logging: design/output-logging.md
      - Volatile Parameters: design/volatile-parameters.md
      - Future Considerations: design/future.md
  - Contributing:
      - Documentation Style Guide: style.md
