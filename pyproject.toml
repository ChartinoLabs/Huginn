[project]
name = "huginn-framework"
dynamic = ["version"]
description = "A Python-native, async-first test automation framework for network infrastructure, servers, and applications."
readme = "README.md"
authors = [
    { name = "Christopher Hart", email = "christopherjhart95@gmail.com" },
    { name = "Andrea Testino", email = "aitestino@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0,<1.0.0",
    "aiohttp>=3.10.5,<4.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "markdown>=3.4.0,<4.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "ruamel.yaml>=0.17.32,<1.0.0",
    "scrapli-netconf[asyncssh]>=2025.1.30",
    "scrapli[asyncssh]>=2025.1.30",
]

[project.scripts]
huginn = "huginn:main"

[project.entry-points."huginn.brokers"]
ssh = "huginn.brokers.ssh:SSHBroker"
http = "huginn.brokers.http:HTTPBroker"
netconf = "huginn.brokers.netconf:NETCONFBroker"

[project.entry-points."huginn.inventory"]
file = "huginn.inventory_plugins:FileInventoryPlugin"

[project.entry-points."huginn.reporters"]
html = "huginn.reporting.html:HTMLReporterPlugin"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/huginn"]

[tool.hatch.build.hooks.vcs]
version-file = "src/huginn/_version.py"

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.18",
    "towncrier==25.8.0",
    "ty==0.0.52",
    "xenon==0.9.3",
]
docs = [
    "mdformat==0.7.22",
    "mdformat-tables==1.0.0",
    "mkdocs-material==9.7.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
exclude = ["src/huginn/_version.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "W",  # pycodestyle warnings
    "C90",# flake8-mccabe complexity
    "N",  # pep8-naming
    "UP", # pyupgrade
    "ANN",# flake8-annotations
    "D",  # pydocstyle
    "T",  # flake8-print (includes T201 for pdb, replacing debug-statements hook)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
title_format = "## {version} - {project_date}"
issue_format = "[#{issue}](https://github.com/ChartinoLabs/Huginn/pull/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal"
showcontent = true
