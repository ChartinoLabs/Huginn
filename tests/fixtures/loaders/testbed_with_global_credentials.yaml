credentials:
  default:
    username: global-admin
    password: global-pass
  readonly:
    username: global-ro
    password: global-ro-pass

devices:
  spine-01:
    os: nxos
    connections:
      ssh:
        protocol: ssh
        host: 10.0.0.1
        port: 22
        credential: default
  leaf-01:
    os: nxos
    credentials:
      default:
        username: device-admin
        password: device-pass
    connections:
      ssh:
        protocol: ssh
        host: 10.0.0.2
        port: 22
        credential: default
